services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://brightloop:brightloop@db:5432/brightloop
      SECRET_KEY: change-me-in-prod
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
